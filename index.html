<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b0d">
  <meta name="description" content="Soham Sapkal — Executive Director at TARSR. Connect on Instagram and LinkedIn.">
  <title>Soham Sapkal | TARSR</title>
  <style>
    :root { --bg:#090b0d; --panel:#111519; --gold:#e8b34e; --muted:#aab0b7; --line:rgba(232,179,78,.25); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0; min-height:100vh; color:#f6f7f8; background:
      radial-gradient(ellipse at 50% 0%, rgba(232,179,78,.13), transparent 42%), var(--bg);
      font-family: Inter, "Segoe UI", Arial, sans-serif; display:flex; flex-direction:column;
    }
    .topline { height:4px; background:linear-gradient(90deg,#76501a,var(--gold),#fff0b7,var(--gold),#76501a); }
    header { width:min(1100px,100%); margin:0 auto; padding:26px 24px; display:flex; align-items:center; justify-content:space-between; }
    .wordmark { letter-spacing:.28em; font-size:.82rem; font-weight:800; }
    .wordmark span { color:var(--gold); }
    .status { color:var(--muted); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; }
    main { flex:1; display:grid; place-items:center; padding:28px 18px 64px; }
    .card { width:min(100%,490px); border:1px solid var(--line); background:linear-gradient(155deg,rgba(255,255,255,.045),rgba(255,255,255,.012)); border-radius:28px; padding:42px 34px 34px; text-align:center; box-shadow:0 28px 90px rgba(0,0,0,.42); position:relative; overflow:hidden; }
    .card:before { content:""; position:absolute; top:0; left:18%; right:18%; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
    .logo-wrap { width:144px; height:144px; border-radius:50%; margin:0 auto 25px; display:grid; place-items:center; border:1px solid var(--line); background:#050607; box-shadow:0 0 0 8px rgba(232,179,78,.035); overflow:hidden; }
    .logo-wrap img { width:100%; height:100%; object-fit:contain; }
    .eyebrow { color:var(--gold); font-size:.7rem; font-weight:700; letter-spacing:.28em; text-transform:uppercase; margin-bottom:12px; }
    h1 { font-size:clamp(2rem,7vw,2.75rem); line-height:1.08; letter-spacing:-.045em; margin:0; font-weight:750; }
    .role { color:#d9dde1; font-size:1rem; margin:14px 0 7px; }
    .company { color:var(--gold); font-size:.78rem; font-weight:800; letter-spacing:.3em; margin-bottom:28px; }
    .divider { height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent); margin:0 0 24px; }
    .actions { display:grid; gap:12px; }
    .btn { min-height:52px; display:flex; align-items:center; justify-content:center; gap:11px; border-radius:13px; text-decoration:none; font-weight:650; font-size:.94rem; transition:transform .18s, border-color .18s, background .18s; }
    .btn:hover { transform:translateY(-2px); }
    .btn-primary { background:var(--gold); color:#17120a; border:1px solid var(--gold); }
    .btn-secondary { color:#f4f5f6; border:1px solid rgba(255,255,255,.13); background:rgba(255,255,255,.035); }
    .btn-secondary:hover { border-color:var(--gold); background:rgba(232,179,78,.07); }
    .icon { width:19px; height:19px; display:inline-grid; place-items:center; font-size:1.1rem; }
    .phone { margin-top:23px; color:var(--muted); font-size:.87rem; }
    .phone a { color:#f6f7f8; text-decoration:none; margin-left:7px; letter-spacing:.02em; }
    .phone a:hover { color:var(--gold); }
    .footer-note { color:#69717a; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; margin-top:28px; }
    footer { text-align:center; padding:0 20px 26px; color:#727982; font-size:.75rem; }
    footer strong { color:#b7bdc4; letter-spacing:.18em; }
    @media(max-width:420px) { header { padding:22px 18px; } .status { display:none; } .card { padding:34px 22px 27px; border-radius:23px; } .logo-wrap { width:128px; height:128px; } }
  </style>
</head>
<body>
  <div class="topline"></div>
  <header>
    <div class="wordmark">TAR<span>SR</span></div>
    <div class="status">Leadership · Connect</div>
  </header>
  <main>
    <section class="card" aria-label="Soham Sapkal contact profile">
      <div class="logo-wrap"><img src="tarsr-logo.png" alt="TARSR logo"></div>
      <div class="eyebrow">Official Contact Card</div>
      <h1>Soham Sapkal</h1>
      <p class="role">Executive Director</p>
      <div class="company">TARSR</div>
      <div class="divider"></div>
      <div class="actions">
        <a class="btn btn-primary" href="tel:+919119427126"><span class="icon" aria-hidden="true">☎</span> Call +91 91194 27126</a>
        <a class="btn btn-secondary" href="https://www.instagram.com/soo._.sapkal/?hl=en" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">◎</span> Instagram</a>
        <a class="btn btn-secondary" href="https://www.linkedin.com/in/soo-sapkal/" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">in</span> LinkedIn</a>
      </div>
      <div class="phone">Direct contact <a href="tel:+919119427126">+91 9119427126</a></div>
      <div class="footer-note">Purpose · Precision · Progress</div>
    </section>
  </main>
  <footer><strong>TARSR</strong><br><br>© <span id="year"></span> · Soham Sapkal</footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
